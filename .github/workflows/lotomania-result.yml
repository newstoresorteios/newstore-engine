name: lotomania-result

on:
  schedule:
    # D+1 às 10:00 BRT — 13:00 UTC, terça, quinta e sábado
    - cron: "0 13 * * 2,4,6"
  workflow_dispatch: {}

jobs:
  result-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: lotomania-result-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py (resultado)
        env:
          # --- VARS (garanta que POSTGRES_URL está DEFINIDO aqui também) ---
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SMTP_HOST: "smtp-relay.brevo.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # E-mails de resultado pelo backend: so passam a valer quando a variavel de corte for definida
          EMAIL_RESULT_AUTOMATION_EFFECTIVE_FROM: ${{ vars.EMAIL_RESULT_AUTOMATION_EFFECTIVE_FROM }}
          BACKEND_INTERNAL_API_BASE: ${{ secrets.BACKEND_INTERNAL_API_BASE }}
          PUSH_INTERNAL_EVENTS_TOKEN: ${{ secrets.PUSH_INTERNAL_EVENTS_TOKEN }}

          COMMIT: "true"
          SMTP_NAME: "NewStore Sorteios"
          APP_NAME: "NewStore Sorteios"
          ADMIN_EMAIL: "newrecreio@gmail.com"
          LOTOMANIA_ENDPOINT: "https://servicebus2.caixa.gov.br/portaldeloterias/api/lotomania"
        run: python main.py
